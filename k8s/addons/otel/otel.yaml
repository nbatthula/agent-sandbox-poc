# OpenTelemetry Collector + Tempo + Loki + Prometheus + Grafana
# Full observability stack for local development
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
# OpenTelemetry Collector
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.106.0
        command: ["--config=/etc/otel/config.yaml"]
        ports:
        - containerPort: 4317  # OTLP gRPC
        - containerPort: 4318  # OTLP HTTP
        - containerPort: 8888  # Prometheus metrics
        - containerPort: 13133 # Health check
        volumeMounts:
        - name: config
          mountPath: /etc/otel
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: config
        configMap:
          name: otel-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
          - job_name: 'orchestrator'
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - orchestrator-system
            relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
          - job_name: 'agent-sandbox'
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - default
            relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_agents_x_k8s_io_sandbox_name]
              action: keep
              regex: .+
          - job_name: 'kubernetes-pods'
            kubernetes_sd_configs:
            - role: pod
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1000
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      k8sattributes:
        auth_type: service_account
        passthrough: false
        filter:
          namespace: default
    exporters:
      tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
      prometheus:
        endpoint: 0.0.0.0:8888
      logging:
        loglevel: debug
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, memory_limiter, k8sattributes]
          exporters: [tempo, logging]
        metrics:
          receivers: [otlp, prometheus]
          processors: [batch, memory_limiter, k8sattributes]
          exporters: [prometheus, logging]
        logs:
          receivers: [otlp]
          processors: [batch, memory_limiter, k8sattributes]
          exporters: [loki, logging]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: prometheus
    port: 8888
    targetPort: 8888
---
# Tempo (Traces)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
      - name: tempo
        image: grafana/tempo:2.4.0
        command: ["-config.file=/etc/tempo.yaml"]
        ports:
        - containerPort: 3100  # HTTP
        - containerPort: 4317  # OTLP gRPC
        - containerPort: 9095  # gRPC
        volumeMounts:
        - name: config
          mountPath: /etc
        - name: data
          mountPath: /tmp/tempo
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
      volumes:
      - name: config
        configMap:
          name: tempo-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
data:
  tempo.yaml: |
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 5m
      trace_idle_period: 10s
    compactor:
      compaction:
        block_retention: 1h
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
spec:
  selector:
    app: tempo
  ports:
  - name: http
    port: 3100
    targetPort: 3100
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: grpc
    port: 9095
    targetPort: 9095
---
# Loki (Logs)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.9.0
        command: ["-config.file=/etc/loki.yaml"]
        ports:
        - containerPort: 3100
        volumeMounts:
        - name: config
          mountPath: /etc
        - name: data
          mountPath: /loki
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    ingester:
      chunk_idle_period: 5m
      chunk_block_size: 256KB
      chunk_retain_period: 30s
    schema_config:
      configs:
      - from: 2024-01-01
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/cache
        cache_ttl: 24h
      filesystem:
        directory: /loki/chunks
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
spec:
  selector:
    app: loki
  ports:
  - port: 3100
    targetPort: 3100
---
# Prometheus (Metrics)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.48.0
        command:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=24h"
        - "--web.enable-lifecycle"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prometheus
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']
    - job_name: 'otel-collector'
      static_configs:
      - targets: ['otel-collector:8888']
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
# Grafana (Dashboards)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.2.0
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-tempo-datasource,grafana-loki-datasource"
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboard-files
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards
        configMap:
          name: grafana-dashboard-providers
      - name: dashboard-files
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo:3100
      editable: false
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki:3100
      editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'Agent Sandbox'
      orgId: 1
      folder: 'Agent Sandbox'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
data:
  sandbox-overview.json: |
    {
      "dashboard": {
        "title": "Agent Sandbox Overview",
        "tags": ["agent-sandbox"],
        "timezone": "browser",
        "panels": [
          {
            "title": "Active Sessions",
            "type": "stat",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "count(sessions_total{status=\"running\"})",
                "legendFormat": "Active"
              }
            ],
            "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4}
          },
          {
            "title": "Sandbox Claims Rate",
            "type": "graph",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "rate(sandbox_claims_created_total[5m])",
                "legendFormat": "Claims/sec"
              },
              {
                "expr": "rate(sandbox_claims_released_total[5m])",
                "legendFormat": "Releases/sec"
              }
            ],
            "gridPos": {"x": 6, "y": 0, "w": 18, "h": 8}
          },
          {
            "title": "Warm Pool Status",
            "type": "stat",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "warm_pool_ready_replicas",
                "legendFormat": "Ready"
              },
              {
                "expr": "warm_pool_desired_replicas",
                "legendFormat": "Desired"
              }
            ],
            "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4}
          },
          {
            "title": "Session Duration",
            "type": "graph",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(session_duration_seconds_bucket[5m]))",
                "legendFormat": "p95"
              },
              {
                "expr": "histogram_quantile(0.50, rate(session_duration_seconds_bucket[5m]))",
                "legendFormat": "p50"
              }
            ],
            "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8}
          },
          {
            "title": "Error Rate",
            "type": "graph",
            "datasource": "Prometheus",
            "targets": [
              {
                "expr": "rate(sessions_failed_total[5m])",
                "legendFormat": "Failed/sec"
              }
            ],
            "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "10s"
      },
      "overwrite": true
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
spec:
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
# Installation Notes
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-install-notes
  namespace: observability
data:
  INSTALL.md: |
    # OpenTelemetry Stack Installation on Rancher Desktop
    
    ## Quick Deploy
    ```bash
    kubectl apply -f k8s/addons/otel/
    ```
    
    ## Port Forwards for Access
    ```bash
    # Grafana (admin/admin)
    kubectl port-forward -n observability svc/grafana 3000:3000
    
    # Tempo
    kubectl port-forward -n observability svc/tempo 3100:3100
    
    # Loki
    kubectl port-forward -n observability svc/loki 3100:3100
    
    # Prometheus
    kubectl port-forward -n observability svc/prometheus 9090:9090
    
    # OTel Collector
    kubectl port-forward -n observability svc/otel-collector 4317:4317 4318:4318
    ```
    
    ## Instrument Your Applications
    ```python
    # Python (orchestrator, agents)
    from opentelemetry import trace
    from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter
    from opentelemetry.sdk.trace import TracerProvider
    from opentelemetry.sdk.trace.export import BatchSpanProcessor
    from opentelemetry.sdk.resources import Resource, SERVICE_NAME
    
    resource = Resource(attributes={SERVICE_NAME: "orchestrator"})
    provider = TracerProvider(resource=resource)
    provider.add_span_processor(BatchSpanProcessor(OTLPSpanExporter(
        endpoint="http://otel-collector.observability:4317",
        insecure=True
    )))
    trace.set_tracer_provider(provider)
    tracer = trace.get_tracer(__name__)
    ```
    
    ## Key Metrics to Track
    - `sessions_total` (by status: pending, running, completed, failed)
    - `sandbox_claims_created_total` / `sandbox_claims_released_total`
    - `warm_pool_ready_replicas` / `warm_pool_desired_replicas`
    - `session_duration_seconds` (histogram)
    - `sandbox_claim_duration_seconds` (histogram)
    - `orchestrator_cpu_seconds` / `orchestrator_memory_bytes`
    
    ## Key Logs to Track
    - Session lifecycle events
    - Sandbox claim/release events
    - Errors and warnings
    - Agent execution logs (stdout/stderr)